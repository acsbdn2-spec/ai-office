<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Office Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f13; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; }

  /* Header */
  header { background: #16161e; border-bottom: 1px solid #2d2d3a; padding: 16px 24px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 20px; font-weight: 700; background: linear-gradient(135deg, #a78bfa, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  header .subtitle { color: #64748b; font-size: 13px; }
  .search-wrap { margin-left: auto; position: relative; }
  .search-wrap input { background: #1e1e2a; border: 1px solid #2d2d3a; color: #e2e8f0; padding: 8px 12px 8px 36px; border-radius: 8px; font-size: 14px; width: 240px; outline: none; transition: border-color 0.2s; }
  .search-wrap input:focus { border-color: #7c3aed; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #64748b; pointer-events: none; }
  .count-badge { background: #1e1e2a; border: 1px solid #2d2d3a; color: #94a3b8; font-size: 12px; padding: 4px 10px; border-radius: 20px; }
  .api-key-wrap { display: flex; align-items: center; gap: 8px; }
  .api-key-wrap input { background: #1e1e2a; border: 1px solid #2d2d3a; color: #e2e8f0; padding: 7px 12px; border-radius: 8px; font-size: 13px; width: 200px; outline: none; transition: border-color 0.2s; font-family: monospace; }
  .api-key-wrap input:focus { border-color: #10b981; }
  .api-key-wrap input::placeholder { color: #475569; font-family: inherit; }
  .api-status { width: 8px; height: 8px; border-radius: 50%; background: #475569; flex-shrink: 0; transition: background 0.2s; }
  .api-status.ok { background: #10b981; }
  .api-label { font-size: 11px; color: #64748b; white-space: nowrap; }

  /* Layout */
  .layout { display: flex; flex: 1; }

  /* Sidebar */
  aside { width: 200px; min-width: 200px; background: #16161e; border-right: 1px solid #2d2d3a; padding: 16px 0; position: sticky; top: 57px; height: calc(100vh - 57px); overflow-y: auto; }
  .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #475569; padding: 0 16px 8px; }
  .filter-btn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 16px; background: none; border: none; color: #94a3b8; font-size: 13px; cursor: pointer; text-align: left; border-left: 3px solid transparent; transition: all 0.15s; }
  .filter-btn:hover { color: #e2e8f0; background: #1e1e2a; }
  .filter-btn.active { color: #a78bfa; background: #1a1a2e; border-left-color: #7c3aed; }
  .filter-btn .cat-count { margin-left: auto; font-size: 11px; color: #475569; background: #1e1e2a; padding: 1px 6px; border-radius: 10px; }
  .filter-btn.active .cat-count { background: #2d1b69; color: #a78bfa; }
  .cat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* Main */
  main { flex: 1; padding: 24px; overflow-y: auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }

  /* Cards */
  .card { background: #16161e; border: 1px solid #2d2d3a; border-radius: 12px; padding: 16px; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
  .card:hover { border-color: #4c1d95; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(124,58,237,0.15); }
  .card .accent-bar { position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: 12px 12px 0 0; }
  .card-emoji { font-size: 28px; margin-bottom: 10px; display: block; }
  .card-name { font-size: 14px; font-weight: 600; color: #e2e8f0; margin-bottom: 6px; line-height: 1.3; }
  .card-vibe { font-size: 11px; color: #64748b; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-cat { display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: #475569; margin-top: 10px; padding: 2px 8px; background: #1e1e2a; border-radius: 10px; }

  /* Panel */
  .panel-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .panel-overlay.open { opacity: 1; pointer-events: all; }
  .panel { position: fixed; right: 0; top: 0; bottom: 0; width: 480px; background: #16161e; border-left: 1px solid #2d2d3a; z-index: 201; transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); overflow-y: auto; display: flex; flex-direction: column; }
  .panel.open { transform: translateX(0); }
  .panel-header { padding: 24px 24px 0; border-bottom: 1px solid #2d2d3a; padding-bottom: 20px; }
  .panel-close { position: absolute; top: 16px; right: 16px; background: #1e1e2a; border: 1px solid #2d2d3a; color: #94a3b8; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .panel-close:hover { color: #e2e8f0; background: #2d2d3a; }
  .panel-emoji { font-size: 40px; margin-bottom: 12px; }
  .panel-name { font-size: 20px; font-weight: 700; color: #e2e8f0; margin-bottom: 4px; }
  .panel-cat { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #64748b; margin-bottom: 12px; }
  .panel-vibe { font-size: 13px; color: #a78bfa; font-style: italic; padding: 10px 14px; background: #1a1a2e; border-radius: 8px; border-left: 3px solid #7c3aed; margin-bottom: 0; line-height: 1.5; }
  .panel-body { padding: 20px 24px; flex: 1; }
  .panel-desc-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #475569; margin-bottom: 8px; }
  .panel-desc { font-size: 13px; color: #94a3b8; line-height: 1.6; margin-bottom: 20px; }
  .assign-section { background: #1e1e2a; border: 1px solid #2d2d3a; border-radius: 10px; padding: 16px; }
  .assign-label { font-size: 12px; font-weight: 700; color: #e2e8f0; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .assign-label span { background: #7c3aed; color: white; font-size: 10px; padding: 2px 8px; border-radius: 10px; }
  textarea { width: 100%; background: #0f0f13; border: 1px solid #2d2d3a; color: #e2e8f0; padding: 10px 12px; border-radius: 8px; font-size: 13px; font-family: inherit; resize: vertical; min-height: 90px; outline: none; transition: border-color 0.2s; line-height: 1.5; }
  textarea:focus { border-color: #7c3aed; }
  textarea::placeholder { color: #475569; }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  .btn { padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s; }
  .btn-primary { background: #7c3aed; color: white; flex: 1; }
  .btn-primary:hover { background: #6d28d9; }
  .btn-secondary { background: #1e1e2a; color: #94a3b8; border: 1px solid #2d2d3a; }
  .btn-secondary:hover { background: #2d2d3a; color: #e2e8f0; }
  .copied-msg { color: #34d399; font-size: 12px; margin-top: 6px; display: none; }
  .copied-msg.show { display: block; }
  .task-list { margin-top: 16px; }
  .task-list-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #475569; margin-bottom: 8px; }
  .task-item { background: #0f0f13; border: 1px solid #2d2d3a; border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; display: flex; align-items: flex-start; gap: 10px; }
  .task-item .task-text { font-size: 12px; color: #94a3b8; line-height: 1.4; flex: 1; }
  .task-item .task-del { background: none; border: none; color: #475569; cursor: pointer; font-size: 16px; padding: 0; line-height: 1; flex-shrink: 0; }
  .task-item .task-del:hover { color: #f87171; }
  .task-item .task-run { background: #10b981; border: none; color: white; cursor: pointer; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; flex-shrink: 0; transition: background 0.15s; }
  .task-item .task-run:hover { background: #059669; }
  .task-item .task-run:disabled { background: #1e1e2a; color: #475569; cursor: not-allowed; }
  .task-output { margin-top: 8px; background: #0f0f13; border: 1px solid #2d2d3a; border-radius: 8px; padding: 12px; font-size: 12px; color: #94a3b8; line-height: 1.6; white-space: pre-wrap; display: none; }
  .task-output.visible { display: block; }
  .task-output.loading { color: #475569; font-style: italic; }
  .task-output.error { color: #f87171; border-color: #7f1d1d; }
  .output-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .output-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #10b981; }
  .output-copy { background: none; border: none; color: #475569; cursor: pointer; font-size: 11px; padding: 0; }
  .output-copy:hover { color: #e2e8f0; }
  .empty-state { color: #475569; font-size: 12px; text-align: center; padding: 12px; }
  .no-results { text-align: center; padding: 60px 20px; color: #475569; }
  .no-results .icon { font-size: 48px; margin-bottom: 12px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>🏢 AI Office</h1>
  </div>
  <div class="subtitle" id="headerSub">184 agents across 15 departments</div>
  <div class="search-wrap">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="text" id="search" placeholder="Search agents…" oninput="render()">
  </div>
  <div class="count-badge" id="countBadge">184</div>
  <div class="api-key-wrap">
    <div class="api-status" id="apiStatus"></div>
    <span class="api-label">Gemini Key</span>
    <input type="password" id="apiKeyInput" placeholder="AIza…" oninput="saveApiKey(this.value)" autocomplete="off">
  </div>
</header>

<div class="layout">
  <aside id="sidebar"></aside>
  <main>
    <div class="grid" id="grid"></div>
    <div class="no-results" id="noResults" style="display:none">
      <div class="icon">🔍</div>
      <div>No agents match your search.</div>
    </div>
  </main>
</div>

<!-- Detail Panel -->
<div class="panel-overlay" id="overlay" onclick="closePanel()"></div>
<div class="panel" id="panel">
  <div class="panel-header" style="position:relative">
    <button class="panel-close" onclick="closePanel()">✕</button>
    <div class="panel-emoji" id="pEmoji"></div>
    <div class="panel-name" id="pName"></div>
    <div class="panel-cat" id="pCat"></div>
    <div class="panel-vibe" id="pVibe"></div>
  </div>
  <div class="panel-body">
    <div class="panel-desc-label">About</div>
    <div class="panel-desc" id="pDesc"></div>
    <div class="assign-section">
      <div class="assign-label">Assign a Task <span>Claude Code</span></div>
      <textarea id="taskInput" placeholder="Describe the task for this agent…"></textarea>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="copyPrompt()">Copy Prompt</button>
        <button class="btn btn-secondary" onclick="saveTask()">Save Task</button>
      </div>
      <div class="copied-msg" id="copiedMsg">✓ Prompt copied to clipboard!</div>
    </div>
    <div class="task-list" id="taskList"></div>
  </div>
</div>

const CAT_COLORS = {
  'academic':'#D97706','design':'#A855F7','engineering':'#3B82F6','finance':'#10B981',
  'game-development':'#EAB308','marketing':'#EC4899','paid-media':'#F97316',
  'product':'#06B6D4','project-management':'#8B5CF6','sales':'#E8590C',
  'spatial-computing':'#14B8A6','specialized':'#6B7280','strategy':'#EF4444',
  'support':'#0EA5E9','testing':'#F43F5E'
};

let activeCategory = 'all';
let currentAgent = null;
let tasks = JSON.parse(localStorage.getItem('agentTasks') || '{}');

function getCats() {
  const cats = {};
  AGENTS.forEach(a => { cats[a.category] = (cats[a.category]||0)+1; });
  return cats;
}

function renderSidebar() {
  const cats = getCats();
  const total = AGENTS.length;
  const sb = document.getElementById('sidebar');
  let html = `<div class="sidebar-title">Departments</div>`;
  html += `<button class="filter-btn ${activeCategory==='all'?'active':''}" onclick="setCategory('all')">
    <span class="cat-dot" style="background:#7c3aed"></span> All Agents
    <span class="cat-count">${total}</span>
  </button>`;
  Object.entries(cats).forEach(([cat, count]) => {
    const color = CAT_COLORS[cat] || '#888';
    const label = cat.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
    html += `<button class="filter-btn ${activeCategory===cat?'active':''}" onclick="setCategory('${cat}')">
      <span class="cat-dot" style="background:${color}"></span> ${label}
      <span class="cat-count">${count}</span>
    </button>`;
  });
  sb.innerHTML = html;
}

function setCategory(cat) {
  activeCategory = cat;
  renderSidebar();
  render();
}

function getColor(a) {
  const c = a.color;
  if (!c || c === '') return CAT_COLORS[a.category] || '#888';
  if (c.startsWith('#')) return c;
  const map = {blue:'#3B82F6',green:'#10B981',red:'#EF4444',purple:'#A855F7',orange:'#F97316',
    pink:'#EC4899',teal:'#14B8A6',cyan:'#06B6D4',indigo:'#6366F1',amber:'#F59E0B',
    yellow:'#EAB308',violet:'#7C3AED',gray:'#6B7280',slate:'#64748B',lime:'#84CC16',
    rose:'#F43F5E',fuchsia:'#D946EF',gold:'#EAB308'};
  return map[c.toLowerCase()] || CAT_COLORS[a.category] || '#888';
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  let filtered = AGENTS.filter(a => {
    const matchCat = activeCategory === 'all' || a.category === activeCategory;
    const matchQ = !q || a.name.toLowerCase().includes(q) || a.desc.toLowerCase().includes(q) || a.vibe.toLowerCase().includes(q) || a.category.includes(q);
    return matchCat && matchQ;
  });

  document.getElementById('countBadge').textContent = filtered.length;
  const grid = document.getElementById('grid');
  const noRes = document.getElementById('noResults');

  if (filtered.length === 0) {
    grid.innerHTML = '';
    noRes.style.display = 'block';
    return;
  }
  noRes.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const color = getColor(a);
    const catLabel = a.category.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
    const taskCount = (tasks[a.name]||[]).length;
    return `<div class="card" onclick="openPanel('${a.name.replace(/'/g,"\\'")}')">
      <div class="accent-bar" style="background:${color}"></div>
      <span class="card-emoji">${a.emoji||'🤖'}</span>
      <div class="card-name">${a.name}${taskCount>0?` <span style="background:${color};color:white;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:700">${taskCount}</span>`:''}</div>
      <div class="card-vibe">${a.vibe||a.desc}</div>
      <div class="card-cat">${catLabel}</div>
    </div>`;
  }).join('');
}

function openPanel(name) {
  const a = AGENTS.find(x => x.name === name);
  if (!a) return;
  currentAgent = a;
  const color = getColor(a);
  document.getElementById('pEmoji').textContent = a.emoji || '🤖';
  document.getElementById('pName').textContent = a.name;
  document.getElementById('pCat').textContent = a.category.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
  document.getElementById('pVibe').textContent = a.vibe || '';
  document.getElementById('pDesc').textContent = a.desc || '';
  document.getElementById('taskInput').value = '';
  document.getElementById('copiedMsg').classList.remove('show');
  renderTaskList(a.name);
  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('panel').classList.remove('open');
  currentAgent = null;
}

function copyPrompt() {
  if (!currentAgent) return;
  const task = document.getElementById('taskInput').value.trim();
  const prompt = task
    ? `Activate the ${currentAgent.name} agent.\n\n${task}`
    : `Activate the ${currentAgent.name} agent.`;
  navigator.clipboard.writeText(prompt).then(() => {
    const msg = document.getElementById('copiedMsg');
    msg.classList.add('show');
    setTimeout(() => msg.classList.remove('show'), 2500);
  });
}

function saveTask() {
  if (!currentAgent) return;
  const task = document.getElementById('taskInput').value.trim();
  if (!task) return;
  if (!tasks[currentAgent.name]) tasks[currentAgent.name] = [];
  tasks[currentAgent.name].push(task);
  localStorage.setItem('agentTasks', JSON.stringify(tasks));
  document.getElementById('taskInput').value = '';
  renderTaskList(currentAgent.name);
  render();
}

function deleteTask(agentName, idx) {
  if (!tasks[agentName]) return;
  tasks[agentName].splice(idx, 1);
  if (tasks[agentName].length === 0) delete tasks[agentName];
  localStorage.setItem('agentTasks', JSON.stringify(tasks));
  renderTaskList(agentName);
  render();
}

function renderTaskList(agentName) {
  const list = document.getElementById('taskList');
  const agentTasks = tasks[agentName] || [];
  if (agentTasks.length === 0) { list.innerHTML = ''; return; }
  const safeAgent = agentName.replace(/'/g,"\\'");
  list.innerHTML = `<div class="task-list-label">Saved Tasks (${agentTasks.length})</div>` +
    agentTasks.map((t,i) => `
      <div class="task-item" id="task-wrap-${i}">
        <div style="flex:1">
          <div class="task-text">${t}</div>
          <div class="task-output" id="task-out-${i}">
            <div class="output-header">
              <span class="output-label">✦ Agent Output</span>
              <button class="output-copy" onclick="copyOutput(${i})" title="Copy output">Copy</button>
            </div>
            <div id="task-out-text-${i}"></div>
          </div>
        </div>
        <button class="task-run" id="task-run-${i}" onclick="runTask('${safeAgent}',${i})">▶ Run</button>
        <button class="task-del" onclick="deleteTask('${safeAgent}',${i})" title="Remove">×</button>
      </div>`).join('');
}

function copyOutput(i) {
  const el = document.getElementById(`task-out-text-${i}`);
  if (el) navigator.clipboard.writeText(el.textContent);
}

function saveApiKey(val) {
  localStorage.setItem('geminiKey', val.trim());
  document.getElementById('apiStatus').className = 'api-status' + (val.trim() ? ' ok' : '');
}

async function runTask(agentName, idx) {
  const key = localStorage.getItem('geminiKey') || '';
  if (!key) {
    alert('Please enter your Gemini API key in the top-right corner first.');
    return;
  }
  const agent = AGENTS.find(a => a.name === agentName);
  if (!agent) return;
  const taskText = (tasks[agentName] || [])[idx];
  if (!taskText) return;

  const runBtn = document.getElementById(`task-run-${idx}`);
  const outBox = document.getElementById(`task-out-${idx}`);
  const outText = document.getElementById(`task-out-text-${idx}`);

  runBtn.disabled = true;
  runBtn.textContent = '…';
  outBox.className = 'task-output visible loading';
  outText.textContent = 'Running with Gemini Flash…';

  const systemPrompt = `You are ${agent.name}. ${agent.desc}\n\nYour approach: ${agent.vibe}`;

  try {
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: systemPrompt }] },
          contents: [{ parts: [{ text: taskText }] }]
        })
      }
    );
    const data = await res.json();
    if (!res.ok) {
      throw new Error(data?.error?.message || `HTTP ${res.status}`);
    }
    const output = data?.candidates?.[0]?.content?.parts?.[0]?.text || 'No response received.';
    outBox.className = 'task-output visible';
    outText.textContent = output;
  } catch (err) {
    outBox.className = 'task-output visible error';
    outText.textContent = `Error: ${err.message}`;
  } finally {
    runBtn.disabled = false;
    runBtn.textContent = '▶ Run';
  }
}

// Init
renderSidebar();
render();

// Restore API key if saved
const savedKey = localStorage.getItem('geminiKey') || '';
if (savedKey) {
  document.getElementById('apiKeyInput').value = savedKey;
  document.getElementById('apiStatus').className = 'api-status ok';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
</script>
</body>
</html>
